version: '3.8'

services:
  api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=db # Garante que a API vai procurar o banco pelo nome do serviço do Docker
    depends_on:
      db:
        condition: service_healthy # Espera o banco estar 100% pronto
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha_segura
      POSTGRES_DB: meu_banco
    ports:
      - "5432:5432" # Para você gerenciar o banco do seu PC (DBeaver/VS Code)
    volumes:
      - db_data:/var/lib/postgresql/data # Salva os dados para não perder ao desligar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_banco"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db_data: